import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest

def baritoneMetadataFile = rootProject.file('third-party/baritone/dependencies.json')
def baritoneMetadata = new JsonSlurper().parse(baritoneMetadataFile)
def minecraftVersion = rootProject.minecraft_version.toString()
def baritoneVersion = baritoneMetadata.minecraft_profiles[minecraftVersion]
if (baritoneVersion == null) {
    throw new GradleException("No pinned Baritone Fabric artifact for Minecraft ${minecraftVersion}")
}
def baritoneRelease = baritoneMetadata.releases.find { it.version == baritoneVersion }
if (baritoneRelease == null) {
    throw new GradleException("No Baritone release metadata for ${baritoneVersion}")
}

def replacementPath = rootProject.findProperty('baritone_jar')?.toString()
def baritoneJar = rootProject.file(".cache/baritone/baritone-api-fabric-${baritoneVersion}.jar")
def replacementJar = replacementPath == null || replacementPath.isBlank()
    ? null
    : rootProject.file(replacementPath)
def fetchBaritoneScript = rootProject.file('scripts/fetch-baritone.py')
def preparationArguments = [
    'python3',
    fetchBaritoneScript.absolutePath,
    '--minecraft-version',
    minecraftVersion,
    '--output',
    baritoneJar.absolutePath
]
if (replacementJar != null) {
    preparationArguments.addAll(['--replacement-jar', replacementJar.absolutePath])
}

def preparationOutput = providers.exec {
    ignoreExitValue true
    commandLine preparationArguments
}
def preparationResult = preparationOutput.result.get()
if (preparationResult.exitValue != 0) {
    def error = preparationOutput.standardError.asText.get().trim()
    throw new GradleException("Baritone artifact preparation failed: ${error}")
}

repositories {
    flatDir { dirs baritoneJar.parentFile }
}

def prepareBaritone = tasks.register('prepareBaritone', Exec) {
    inputs.file(baritoneMetadataFile)
    inputs.file(fetchBaritoneScript)
    inputs.property('minecraftVersion', minecraftVersion)
    inputs.property('baritoneVersion', baritoneVersion)
    inputs.property('replacementJar', replacementJar == null ? '' : replacementJar.absolutePath)
    if (replacementJar != null) {
        inputs.file(replacementJar)
    }
    outputs.file(baritoneJar)
    commandLine preparationArguments
}

def baritoneCoordinate = "baritone:baritone-api-fabric:${baritoneVersion}"
// Unobfuscated Minecraft 26.x uses ordinary dependency configurations in Loom.
dependencies.add(configurations.findByName('modImplementation') == null ? 'implementation' : 'modImplementation', baritoneCoordinate)
dependencies.add('include', baritoneCoordinate)

def bridgeMetadataPath = rootProject.findProperty('baritone_bridge_metadata')?.toString()
if (bridgeMetadataPath != null && !new File(bridgeMetadataPath).isAbsolute()) {
    throw new GradleException('baritone_bridge_metadata must name an absolute reviewed mapping file')
}
def bridgeMetadataFile = bridgeMetadataPath == null
    ? rootProject.file('third-party/baritone/mining-bridge.json')
    : new File(bridgeMetadataPath)
def bridgePackage = project.name == 'fabric-modern' ? 'dev.lodekeeper.fabric.modern' : 'dev.lodekeeper.fabric'
def bridgeBlockPos = project.name == 'fabric-modern' ? 'net.minecraft.core.BlockPos' : 'net.minecraft.util.math.BlockPos'
def bridgeJavaDirectory = layout.buildDirectory.dir('generated/baritone-bridge/java')
def bridgeResourceDirectory = layout.buildDirectory.dir('generated/baritone-bridge/resources')
def bridgeConfigName = 'lodekeeper-baritone.mixins.json'
def generateBaritoneMiningBridge = tasks.register('generateBaritoneMiningBridge') {
    dependsOn prepareBaritone
    inputs.file(baritoneJar)
    inputs.file(bridgeMetadataFile)
    inputs.property('bridgePackage', bridgePackage)
    inputs.property('bridgeBlockPos', bridgeBlockPos)
    outputs.dir(bridgeJavaDirectory)
    outputs.dir(bridgeResourceDirectory)
    doLast {
        def digest = MessageDigest.getInstance('SHA-256')
        baritoneJar.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        def jarSha = digest.digest().encodeHex().toString()
        def metadata = new JsonSlurper().parse(bridgeMetadataFile)
        if (metadata.schema_version != 1 || !(metadata.supported instanceof List)) {
            throw new GradleException("Invalid Baritone mining bridge metadata: ${bridgeMetadataFile}")
        }
        def matches = metadata.supported.findAll { it.jarSha256 == jarSha }
        if (matches.size() != 1) {
            throw new GradleException("Unsupported Baritone mining bridge artifact SHA-256 ${jarSha}. " +
                'Review the artifact with scripts/inspect-baritone-mining.py, regenerate its accessor mapping, ' +
                'and rebuild with -Pbaritone_bridge_metadata=/absolute/reviewed-mapping.json.')
        }
        def mapping = matches[0]
        def identifier = /[A-Za-z_$][A-Za-z0-9_$]*/
        def className = /[A-Za-z_$][A-Za-z0-9_$]*(\.[A-Za-z_$][A-Za-z0-9_$]*)*/
        if (!(mapping.targetClass instanceof String) || !(mapping.targetClass ==~ className)
            || !(mapping.knownField instanceof String) || !(mapping.knownField ==~ identifier)
            || !(mapping.blacklistField instanceof String) || !(mapping.blacklistField ==~ identifier)
            || mapping.knownField == mapping.blacklistField
            || mapping.field_descriptor != 'Ljava/util/List;') {
            throw new GradleException("Invalid List accessor mapping for Baritone SHA-256 ${jarSha}")
        }
        def javaRoot = bridgeJavaDirectory.get().asFile
        def resourceRoot = bridgeResourceDirectory.get().asFile
        javaRoot.mkdirs()
        resourceRoot.mkdirs()
        def source = new File(javaRoot, "${bridgePackage.replace('.', '/')}/mixin/BaritoneMiningAccessor.java")
        source.parentFile.mkdirs()
        source.setText("""package ${bridgePackage}.mixin;

import ${bridgePackage}.BaritoneMiningAccess;
import ${bridgeBlockPos};
import java.util.List;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.gen.Accessor;

@Mixin(targets = "${mapping.targetClass}", remap = false)
public interface BaritoneMiningAccessor extends BaritoneMiningAccess {
    @Override
    @Accessor(value = "${mapping.knownField}", remap = false)
    List<BlockPos> lodekeeper\$knownMiningTargets();

    @Override
    @Accessor(value = "${mapping.knownField}", remap = false)
    void lodekeeper\$knownMiningTargets(List<BlockPos> value);

    @Override
    @Accessor(value = "${mapping.blacklistField}", remap = false)
    List<BlockPos> lodekeeper\$blacklistedMiningTargets();
}
""", 'UTF-8')
        def config = [required: true, minVersion: '0.8', 'package': "${bridgePackage}.mixin",
                      client: ['BaritoneMiningAccessor']]
        new File(resourceRoot, bridgeConfigName).setText(JsonOutput.prettyPrint(JsonOutput.toJson(config)) + '\n', 'UTF-8')
    }
}
sourceSets.main.java.srcDir(bridgeJavaDirectory)
sourceSets.main.resources.srcDir(bridgeResourceDirectory)
tasks.named('compileJava').configure { dependsOn generateBaritoneMiningBridge }
tasks.named('processResources').configure {
    dependsOn generateBaritoneMiningBridge
    inputs.property('baritoneBridgeConfig', bridgeConfigName)
    doLast {
        def manifestFile = new File(destinationDir, 'fabric.mod.json')
        def manifest = new JsonSlurper().parse(manifestFile)
        if (manifest.mixins != null && !(manifest.mixins instanceof List)) {
            throw new GradleException('fabric.mod.json mixins must be a list')
        }
        def mixins = manifest.mixins == null ? [] : new ArrayList(manifest.mixins)
        if (!mixins.any { it == bridgeConfigName || (it instanceof Map && it.config == bridgeConfigName) }) {
            mixins.add(bridgeConfigName)
        }
        manifest.mixins = mixins
        manifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

tasks.configureEach {
    if (name in ['compileJava', 'jar', 'remapDependencies', 'processIncludeJars', 'remapJar']
        || name.startsWith('run')) {
        dependsOn prepareBaritone
    }
}

tasks.named('jar').configure {
    from(rootProject.file('third-party/baritone/licenses')) {
        into 'META-INF/licenses/baritone'
    }
    from(rootProject.file('third-party/baritone/NOTICE.md')) {
        into 'META-INF/licenses/baritone'
    }
    from(baritoneMetadataFile) {
        into 'META-INF/licenses/baritone'
    }
    from(bridgeMetadataFile) {
        into 'META-INF/lodekeeper/baritone'
        rename { 'mining-bridge.json' }
    }
    from(rootProject.file('scripts/inspect-baritone-mining.py')) {
        into 'META-INF/lodekeeper/baritone'
    }
}
