plugins { id 'fabric-loom' }
def supportedMinecraftVersions = ['1.20.2', '1.20.3', '1.20.4']
if (!supportedMinecraftVersions.contains(rootProject.minecraft_version.toString())) {
    throw new GradleException("fabric-1202 supports Minecraft ${supportedMinecraftVersions.join(', ')}; select an exact profile")
}
base { archivesName = "lodekeeper-${rootProject.minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
def generatedSharedSources = layout.buildDirectory.dir('generated/shared-main-java')
def copySharedSources = tasks.register('copySharedSources', Sync) {
    from(rootProject.file('fabric/src/main/java')) {
        exclude 'dev/lodekeeper/fabric/WorldVisualizationRenderApi.java'
    }
    into generatedSharedSources
}
sourceSets {
    main {
        java.srcDirs = [generatedSharedSources, rootProject.file('fabric/src/legacy-render/java'), 'src/main/java']
    }
    test.java.srcDir rootProject.file('fabric/src/test/java')
    verification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        java.srcDir(layout.buildDirectory.dir('generated/shared-verification'))
        def worldStartFamily = rootProject.minecraft_version.toString() == '1.20.2' ? '1202' : '1203'
        java.srcDir "src/verification-start-${worldStartFamily}/java"
        resources.srcDirs = ['src/verification/resources']
    }
}
tasks.named('compileJava').configure { dependsOn copySharedSources }
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    implementation project(':nav')
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':nav').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    dependsOn ':core:classes', ':nav:classes'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', rootProject.minecraft_version
    from(rootProject.file('fabric/src/main/resources')) { exclude 'fabric.mod.json' }
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: rootProject.minecraft_version }
}
processVerificationResources {
    inputs.property 'minecraft', rootProject.minecraft_version
    filesMatching('fabric.mod.json') { expand minecraft: rootProject.minecraft_version }
}
loom {
    mixin { defaultRefmapName = 'lodekeeper-refmap.json' }
    mods {
        lodekeeper { sourceSet sourceSets.main }
        'lodekeeper-verification' { sourceSet sourceSets.verification }
    }
    runs {
        client { vmArg '-Xmx1536m'; vmArg '-XX:ActiveProcessorCount=2' }
        verificationClient {
            client()
            source sourceSets.verification
            runDir 'run'
            vmArg '-Dlodekeeper.verify=true'
            vmArg '-Xmx1536m'
            vmArg '-XX:ActiveProcessorCount=2'
            programArg '--width'
            programArg '640'
            programArg '--height'
            programArg '360'
        }
    }
}

def generatedVerifierDir = layout.buildDirectory.dir('generated/shared-verification')
def copySharedVerifier = tasks.register('copySharedVerifier', Sync) {
    from(rootProject.file('fabric/src/verification/java')) {
        exclude 'dev/lodekeeper/fabric/VerificationApi.java'
    }
    into generatedVerifierDir
}
tasks.named('compileVerificationJava').configure { dependsOn copySharedVerifier }

apply from: rootProject.file('gradle/owned-kernel-yarn-host-integration.gradle')

apply from: rootProject.file('gradle/artifact-verification.gradle')

apply from: rootProject.file('gradle/owned-kernel-notices.gradle')
