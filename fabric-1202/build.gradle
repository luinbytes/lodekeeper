plugins { id 'fabric-loom' }
def supportedMinecraftVersions = ['1.20.2', '1.20.3', '1.20.4']
if (!supportedMinecraftVersions.contains(rootProject.minecraft_version.toString())) {
    throw new GradleException("fabric-1202 supports Minecraft ${supportedMinecraftVersions.join(', ')}; select an exact profile")
}
base { archivesName = "lodekeeper-${rootProject.minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
sourceSets {
    main {
        java.srcDirs = [rootProject.file('fabric/src/main/java'), 'src/main/java']
    }
    test.java.srcDir rootProject.file('fabric/src/test/java')
}
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    implementation project(':nav')
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':nav').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    dependsOn ':core:classes', ':nav:classes'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', rootProject.minecraft_version
    from(rootProject.file('fabric/src/main/resources')) { exclude 'fabric.mod.json' }
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: rootProject.minecraft_version }
}
loom {
    mixin { defaultRefmapName = 'lodekeeper-refmap.json' }
    runs { client { vmArg '-Xmx1536m'; vmArg '-XX:ActiveProcessorCount=2' } }
}
