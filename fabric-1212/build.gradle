plugins { id 'fabric-loom' version '1.8.13' }
def supportedMinecraftVersions = ['1.21.2', '1.21.3']
if (!supportedMinecraftVersions.contains(rootProject.minecraft_version.toString())) {
    throw new GradleException("fabric-1212 supports Minecraft ${supportedMinecraftVersions.join(', ')}; select an exact profile")
}
base { archivesName = "lodekeeper-${rootProject.minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }

def generatedSharedSources = layout.buildDirectory.dir('generated/shared-main-java')
def copySharedSources = tasks.register('copySharedSources', Copy) {
    from(rootProject.file('fabric/src/main/java')) {
        exclude 'dev/lodekeeper/fabric/BotInput.java'
        exclude 'dev/lodekeeper/fabric/mixin/RecipeSyncMixin.java'
    }
    into generatedSharedSources
}

sourceSets {
    main {
        java.srcDirs = [generatedSharedSources, 'src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    test.java.srcDir rootProject.file('fabric/src/test/java')
}
tasks.named('compileJava').configure { dependsOn copySharedSources }

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    implementation project(':nav')
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':nav').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    dependsOn ':core:classes', ':nav:classes'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', rootProject.minecraft_version
    from(rootProject.file('fabric/src/main/resources')) {
        exclude 'fabric.mod.json'
        exclude 'lodekeeper.mixins.json'
    }
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: rootProject.minecraft_version }
}
loom {
    mixin { defaultRefmapName = 'lodekeeper-refmap.json' }
    runs { client { vmArg '-Xmx1536m'; vmArg '-XX:ActiveProcessorCount=2' } }
    mods { lodekeeper { sourceSet sourceSets.main } }
}
