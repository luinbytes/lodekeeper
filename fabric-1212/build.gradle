plugins { id 'net.fabricmc.fabric-loom-remap' }
def inputApiFamilies = [
    '1.21.2': '1212', '1.21.3': '1212', '1.21.4': '1214',
    '1.21.5': '1215', '1.21.6': '1215', '1.21.7': '1215',
    '1.21.8': '1215', '1.21.9': '1215', '1.21.10': '1215', '1.21.11': '1215'
]
def minecraftVersion = rootProject.minecraft_version.toString()
def expectedInputApiFamily = inputApiFamilies[minecraftVersion]
if (expectedInputApiFamily == null) {
    throw new GradleException("fabric-1212 has no source profile for Minecraft ${minecraftVersion}; select an exact profile")
}
def selectedInputApiFamily = rootProject.findProperty('input_api_family')?.toString()
if (selectedInputApiFamily != expectedInputApiFamily) {
    throw new GradleException("Minecraft ${minecraftVersion} requires -Pinput_api_family=${expectedInputApiFamily}")
}
def clientApiFamily = ['1.21.2', '1.21.3', '1.21.4'].contains(minecraftVersion) ? '1212'
    : ['1.21.5', '1.21.6', '1.21.7', '1.21.8'].contains(minecraftVersion) ? '1215' : '1219'
def renderApiFamily = ['1.21.9', '1.21.10'].contains(minecraftVersion) ? '1219'
    : minecraftVersion == '1.21.11' ? '12111' : null
base { archivesName = "lodekeeper-${rootProject.minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }

def generatedSharedSources = layout.buildDirectory.dir('generated/shared-main-java')
def generatedWeaponWearSources = layout.buildDirectory.dir('generated/weapon-wear-java')
def generatedWeaponWearFile = generatedWeaponWearSources.map { it.file('dev/lodekeeper/fabric/WeaponWearApi.java') }
def vanillaAttackWearMethod = expectedInputApiFamily == '1215'
    ? '''static int attackWear(net.minecraft.item.ItemStack stack) {
        if (!stack.isDamageable()) return 0;
        var weapon = stack.get(net.minecraft.component.DataComponentTypes.WEAPON);
        return weapon == null ? -1 : weapon.itemDamagePerAttack();
    }'''
    : '''static int attackWear(net.minecraft.item.ItemStack stack) {
        if (!stack.isDamageable()) return 0;
        Class<?> type = stack.getItem().getClass();
        if (type == net.minecraft.item.SwordItem.class) return 1;
        if (type == net.minecraft.item.AxeItem.class) return 2;
        return -1;
    }'''
def vanillaDefenseAttackWearMethod = expectedInputApiFamily == '1215'
    ? '''static int defenseAttackWear(net.minecraft.item.ItemStack stack) {
        Class<?> type = stack.getItem().getClass();
        if (type != net.minecraft.item.Item.class && type != net.minecraft.item.AxeItem.class
                && type != net.minecraft.item.ShovelItem.class && type != net.minecraft.item.HoeItem.class) return -1;
        if (!(stack.isIn(net.minecraft.registry.tag.ItemTags.SWORDS) || stack.isIn(net.minecraft.registry.tag.ItemTags.AXES)
                || stack.isIn(net.minecraft.registry.tag.ItemTags.PICKAXES) || stack.isIn(net.minecraft.registry.tag.ItemTags.SHOVELS)
                || stack.isIn(net.minecraft.registry.tag.ItemTags.HOES))) return -1;
        return attackWear(stack);
    }'''
    : '''static int defenseAttackWear(net.minecraft.item.ItemStack stack) {
        int known = attackWear(stack);
        if (known >= 0) return known;
        Class<?> type = stack.getItem().getClass();
        return type == net.minecraft.item.PickaxeItem.class || type == net.minecraft.item.ShovelItem.class
                || type == net.minecraft.item.HoeItem.class ? 2 : -1;
    }'''
def generateWeaponWearApi = tasks.register('generateWeaponWearApi') {
    inputs.property('inputApiFamily', expectedInputApiFamily)
    outputs.file(generatedWeaponWearFile)
    doLast {
        File output = generatedWeaponWearFile.get().asFile
        output.parentFile.mkdirs()
        output.setText("""package dev.lodekeeper.fabric;

final class WeaponWearApi {
    private WeaponWearApi() {}

    ${vanillaAttackWearMethod}

    ${vanillaDefenseAttackWearMethod}
}
""", 'UTF-8')
    }
}
def copySharedSources = tasks.register('copySharedSources', Sync) {
    inputs.property('inputApiFamily', expectedInputApiFamily)
    inputs.property('clientApiFamily', clientApiFamily)
    from(rootProject.file('fabric/src/main/java')) {
        exclude 'dev/lodekeeper/fabric/BotInput.java'
        exclude 'dev/lodekeeper/fabric/ClientAccess.java'
        exclude 'dev/lodekeeper/fabric/mixin/RecipeSyncMixin.java'
        if (renderApiFamily != null) {
            exclude 'dev/lodekeeper/fabric/WorldVisualizationRenderApi.java'
        }
        filesMatching('dev/lodekeeper/fabric/MovementController.java') {
            filter { String line ->
                String adapted = line
                    .replace('player.input.jumping', 'player.input.playerInput.jump()')
                    .replace('player.input.sneaking', 'player.input.playerInput.sneak()')
                if (expectedInputApiFamily == '1215') {
                    adapted = adapted
                        .replace('player.input.movementSideways', 'player.input.getMovementInput().x')
                        .replace('player.input.movementForward', 'player.input.getMovementInput().y')
                }
                if (clientApiFamily == '1219') {
                    adapted = adapted.replace('.getWorld()', '.getEntityWorld()')
                }
                adapted
            }
        }
    }
    into generatedSharedSources
}

sourceSets {
    main {
        java.srcDirs = [generatedSharedSources, 'src/main/java']
        java.srcDir generatedWeaponWearSources
        java.srcDir "src/${expectedInputApiFamily}/java"
        java.srcDir "src/client-${clientApiFamily}/java"
        if (renderApiFamily != null) java.srcDir "src/render-${renderApiFamily}/java"
        resources.srcDirs = ['src/main/resources']
        if (renderApiFamily == '1219') resources.srcDir 'src/render-1219/resources'
    }
    test.java.srcDir rootProject.file('fabric/src/test/java')
    verification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        java.srcDir(layout.buildDirectory.dir('generated/shared-verification'))
        def verifierApiFamily = minecraftVersion == '1.21.11' ? '12111'
            : ['1.21.9', '1.21.10'].contains(minecraftVersion) ? '1219'
            : ['1.21.6', '1.21.7', '1.21.8'].contains(minecraftVersion) ? '1216' : '1212'
        java.srcDir "src/verification-${verifierApiFamily}/java"
        resources.srcDirs = ['src/verification/resources']
    }
}
tasks.named('compileJava').configure { dependsOn copySharedSources, generateWeaponWearApi }

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    implementation project(':nav')
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':nav').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    dependsOn ':core:classes', ':nav:classes'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', rootProject.minecraft_version
    inputs.property 'renderApiFamily', renderApiFamily ?: 'standard'
    from(rootProject.file('fabric/src/main/resources')) {
        exclude 'fabric.mod.json'
        exclude 'lodekeeper.mixins.json'
    }
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: rootProject.minecraft_version
    }
    doLast {
        if (renderApiFamily == '1219') {
            File manifest = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(manifest)
            metadata.mixins.add('lodekeeper-render-1219.mixins.json')
            manifest.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
        }
    }
}
loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'lodekeeper-refmap.json' }
    runs {
        client { vmArg '-Xmx1536m'; vmArg '-XX:ActiveProcessorCount=2' }
        verificationClient {
            client()
            source sourceSets.verification
            runDir 'run'
            vmArg '-Dlodekeeper.verify=true'
            vmArg '-Xmx1536m'
            vmArg '-XX:ActiveProcessorCount=2'
            programArg '--width'
            programArg '640'
            programArg '--height'
            programArg '360'
        }
    }
    mods {
        lodekeeper { sourceSet sourceSets.main }
        'lodekeeper-verification' { sourceSet sourceSets.verification }
    }
}

def sharedVerificationSources = [
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/RuntimeVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/NaturalWorldVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/VerificationContentInitializer.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/GeometryEpochVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/ConfigRoundTripVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/NavigationSettingsVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/SettingsUiVerification.java')
]
def nativeSettingsUiAccessSource = null
if (!['1.21.9', '1.21.10'].contains(minecraftVersion)) {
    nativeSettingsUiAccessSource = clientApiFamily == '1219'
        ? layout.projectDirectory.file('src/verification-1219/java/dev/lodekeeper/fabric/NativeSettingsUiAccess.java').asFile
        : rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/NativeSettingsUiAccess.java')
}
def generatedVerifierDir = layout.buildDirectory.dir('generated/shared-verification')
def copySharedVerifier = tasks.register('copySharedVerifier', Sync) {
    from(sharedVerificationSources) { into 'dev/lodekeeper/fabric' }
    if (nativeSettingsUiAccessSource != null) {
        from(nativeSettingsUiAccessSource) {
            into 'dev/lodekeeper/fabric'
            if (minecraftVersion == '1.21.11') {
                filter { String line -> line
                    .replace('client.currentScreen.resize(client, width, height);', 'client.currentScreen.resize(width, height);')
                    .replace('Screen.resize(client,width,height)', 'Screen.resize(width,height)')
                }
            }
        }
    }
    inputs.property('minecraftVersion', minecraftVersion)
    into(generatedVerifierDir)
}
tasks.named('compileVerificationJava').configure { dependsOn copySharedVerifier }

tasks.named('processVerificationResources').configure {
    inputs.property 'version', project.version
    inputs.property 'minecraft', rootProject.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: rootProject.minecraft_version
    }
}

def prepareVerificationOptions = tasks.register('prepareVerificationOptions') {
    def optionsFile = layout.projectDirectory.file('run/options.txt')
    outputs.file(optionsFile)
    doLast {
        File file = optionsFile.asFile
        if (!file.exists()) {
            file.parentFile.mkdirs()
            file.setText('''renderDistance:2
simulationDistance:5
maxFps:30
fullscreen:false
enableVsync:true
guiScale:2
soundCategory_master:0.0
particles:2
clouds:false
entityDistanceScaling:0.5
useNativeTransport:false

pauseOnLostFocus:false
''', 'UTF-8')
        }
    }
}
tasks.configureEach {
    if (name == 'runVerificationClient') dependsOn prepareVerificationOptions
}

apply from: rootProject.file('gradle/owned-kernel-yarn-host-integration.gradle')

apply from: rootProject.file('gradle/artifact-verification.gradle')

apply from: rootProject.file('gradle/owned-kernel-notices.gradle')
