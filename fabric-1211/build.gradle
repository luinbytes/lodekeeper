plugins { id 'fabric-loom' version '1.8.13' }
base { archivesName = "lodekeeper-${rootProject.minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
sourceSets {
    main {
        def profileApi = ['1.20.5', '1.20.6'].contains(rootProject.minecraft_version) ? 'src/1205/java' : 'src/main/java'
        java.srcDirs = [rootProject.file('fabric/src/main/java'), profileApi]
    }
    test.java.srcDir rootProject.file('fabric/src/test/java')
    verification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        java.srcDir(layout.buildDirectory.dir('generated/shared-verification'))
        resources.srcDirs = ['src/verification/resources']
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    implementation project(':nav')
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':nav').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    dependsOn ':core:classes', ':nav:classes'
}
processResources {
    inputs.property 'version', project.version
    from(rootProject.file('fabric/src/main/resources')) { exclude 'fabric.mod.json' }
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: rootProject.minecraft_version }
}
loom {
    mixin { defaultRefmapName = 'lodekeeper-refmap.json' }
    runs { client { vmArg '-Xmx1536m'; vmArg '-XX:ActiveProcessorCount=2' } }
    mods {
        lodekeeper { sourceSet sourceSets.main }
        'lodekeeper-verification' { sourceSet sourceSets.verification }
    }
    runs {
        verificationClient {
            client()
            source sourceSets.verification
            runDir 'run'
            vmArg '-Dlodekeeper.verify=true'
            vmArg '-Xmx1536m'
            vmArg '-XX:ActiveProcessorCount=2'
            programArg '--width'
            programArg '640'
            programArg '--height'
            programArg '360'
        }
    }
}

def sharedVerificationSources = [
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/RuntimeVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/NaturalWorldVerification.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/VerificationContentInitializer.java'),
    rootProject.file('fabric/src/verification/java/dev/lodekeeper/fabric/GeometryEpochVerification.java')
]
def generatedVerifierDir = layout.buildDirectory.dir('generated/shared-verification')
def copySharedVerifier = tasks.register('copySharedVerifier', Copy) {
    from(sharedVerificationSources) { into 'dev/lodekeeper/fabric' }
    into(generatedVerifierDir)
}
tasks.named('compileVerificationJava').configure { dependsOn copySharedVerifier }

def prepareVerificationOptions = tasks.register('prepareVerificationOptions') {
    def optionsFile = layout.projectDirectory.file('run/options.txt')
    outputs.file(optionsFile)
    doLast {
        File file = optionsFile.asFile
        if (!file.exists()) {
            file.parentFile.mkdirs()
            file.setText('''renderDistance:2
simulationDistance:5
maxFps:30
fullscreen:false
enableVsync:true
guiScale:2
soundCategory_master:0.0
particles:2
clouds:false
entityDistanceScaling:0.5
useNativeTransport:false

pauseOnLostFocus:false
''', 'UTF-8')
        }
    }
}
tasks.configureEach {
    if (name == 'runVerificationClient') dependsOn prepareVerificationOptions
}

apply from: rootProject.file('gradle/baritone.gradle')
