name: Build and regression checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - minecraft: '1.20'
            java: '17'
            module: fabric
          - minecraft: '1.20.1'
            java: '17'
            module: fabric
          - minecraft: '1.20.2'
            java: '17'
            module: fabric-1202
          - minecraft: '1.20.3'
            java: '17'
            module: fabric-1202
          - minecraft: '1.20.4'
            java: '17'
            module: fabric-1202
          - minecraft: '1.20.5'
            java: '21'
            module: fabric-1211
          - minecraft: '1.20.6'
            java: '21'
            module: fabric-1211
          - minecraft: '1.21'
            java: '21'
            module: fabric-1211
          - minecraft: '1.21.1'
            java: '21'
            module: fabric-1211
          - minecraft: '1.21.2'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.3'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.4'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.5'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.6'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.7'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.8'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.9'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.10'
            java: '21'
            module: fabric-1212
          - minecraft: '1.21.11'
            java: '21'
            module: fabric-1212
          - minecraft: '26.1'
            java: '25'
            module: fabric-modern
          - minecraft: '26.1.1'
            java: '25'
            module: fabric-modern
          - minecraft: '26.1.2'
            java: '25'
            module: fabric-modern
          - minecraft: '26.2'
            java: '25'
            module: fabric-modern
          - minecraft: '26.3'
            java: '25'
            module: fabric-modern
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Compile, check and package the exact game adapter
        run: ./scripts/build-version.sh '${{ matrix.minecraft }}' --no-daemon
      - name: Preserve regression failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-failures-${{ matrix.minecraft }}
          path: |
            core/build/test-results/test/*.xml
            nav/build/test-results/test/*.xml
            ${{ matrix.module }}/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Record artifact digest
        run: sha256sum '${{ matrix.module }}'/build/libs/*.jar > '${{ matrix.module }}'/build/libs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lodekeeper-${{ matrix.minecraft }}-development
          path: ${{ matrix.module }}/build/libs/
          if-no-files-found: error
