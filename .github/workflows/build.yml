name: Build and regression checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile, check and package the 1.20.1 adapter
        run: ./gradlew --no-daemon :core:test :nav:test :fabric:build
      - name: Record artifact digest
        run: sha256sum fabric/build/libs/*.jar > fabric/build/libs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lodekeeper-1.20.1-development
          path: fabric/build/libs/
          if-no-files-found: error
